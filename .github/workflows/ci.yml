name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer push lands on the same ref. Cuts
# wall time on rapid push-on-push by ~30-60s of wasted CI quota.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # Type-check the annotations shipped via py.typed (#127, #129) so
      # they stay honest against the code. Config lives in pyproject.toml
      # ([tool.mypy]); non-strict baseline (D-014).
      - run: mypy

  test:
    runs-on: ubuntu-latest
    # 30, not 15, and sized from the measurement rather than from convenience
    # (#229). `test (3.12)` was cancelled on `main` at 15m05s on 2026-09-22 and
    # again at 15m10s on 2026-09-28; over the ten newest push runs its duration
    # was at or above 88% of the old 15-minute cap in eight of them. The worst
    # observed run is now at 0.51 of its cap, under the 0.80 bar
    # `portfolio-ops`' `timeout-headroom` fingerprint applies, and still 12x
    # below GitHub's 360-minute default so a genuinely hung job is caught in
    # half an hour rather than six.
    #
    # This is a cap that was never sized, not a regression being accommodated:
    # for the cancelled run, checkout + setup-python + `pip install` total 29s
    # of the 910s job and `pytest --cov` is 877s, and the fifteen slowest tests
    # locally are a flat tail between 1.34s and 1.45s rather than one
    # pathological case.
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `[dashboard]` (streamlit + pandas) is installed alongside `[dev]` so
      # the 8 savings-dashboard tests in tests/test_bench_savings.py actually
      # execute. Their `find_spec(...) -> pytest.skip(...)` guards are correct
      # for a contributor's minimal venv, but under a `[dev]`-only CI install
      # they skipped every run — the job went green while nothing checked a
      # feature that is layer 5 of the README and reads docs/savings.json
      # directly (#170). Both are pure-Python wheels: no service, no network,
      # no secret, so CI stays hermetic.
      - run: pip install -e '.[dev,dashboard]'
      # `--durations=10` because local profiling cannot attribute CI time: the
      # same suite is 39s here and 624-910s on a two-core runner under coverage,
      # and without durations in the log there is nothing to read the gap off
      # (#229). Costs nothing and makes the next investigation possible.
      - run: pytest --cov=cost_optimizer --cov-report=term-missing --durations=10

  memory-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify MEMORY directory exists and has required files
        run: |
          test -f MEMORY/full_history_ai.md
          test -f MEMORY/full_history_human.md
          test -f MEMORY/core_decisions_ai.md
          test -f MEMORY/core_decisions_human.md
      - name: Verify D-001 baseline decision exists
        run: |
          grep -q "id: D-001" MEMORY/core_decisions_ai.md
